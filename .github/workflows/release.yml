name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub Actions tab

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # latest.yml is required by electron-updater to detect new
            # versions - without it, installed apps never see an update.
            artifact_glob: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: macos-latest
            artifact_glob: |
              release/*.dmg
              release/*.dmg.blockmap
              release/latest-mac.yml

    runs-on: ${{ matrix.os }}

    # We need write permissions to upload the built installers to the Release page
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Sync package.json version to the pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        # The tag is the single source of truth for the release version -
        # `git tag vX.Y.Z && git push origin vX.Y.Z` is all that's needed.
        # No more editing package.json by hand before tagging (and no risk
        # of the two drifting apart): --no-git-tag-version just rewrites
        # the file, it doesn't try to commit/tag again mid-build.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          echo "package.json version set to $TAG_VERSION (from tag $GITHUB_REF_NAME)"

      - name: Fetch offline OCR language data
        run: npm run fetch:tessdata

      - name: Configure macOS code signing (optional)
        if: matrix.os == 'macos-latest'
        shell: bash
        # Only inject these into the environment if the secrets actually
        # exist. Writing `CSC_LINK: ${{ secrets.CSC_LINK }}` directly into a
        # step's `env:` sets CSC_LINK to an EMPTY STRING (not unset) whenever
        # the secret is missing - GitHub Actions always substitutes, never
        # omits. electron-builder's signer then treats that empty string as
        # "a cert path was given," tries to resolve it, and crashes the
        # entire macOS build. Gating it here means: no secrets configured =
        # .dmg builds unsigned (Gatekeeper "unidentified developer" warning,
        # right-click > Open past it once); secrets added later = signing
        # and notarization kick in automatically, no workflow changes needed.
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
            echo "Code signing secrets found - .dmg will be signed and notarized."
          else
            echo "No code signing secrets configured - .dmg will build unsigned."
          fi

      - name: Compile Application & Build Installer
        run: npm run build
        env:
          # GitHub provides this automatically
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Data-Driven Release Notes
        if: matrix.os == 'windows-latest'
        id: changelog
        run: |
          echo "## Jontro Build Analytics" > release-notes.md
          echo "Automated Release Pipeline Execution." >> release-notes.md
          echo "" >> release-notes.md
          echo "### Commit History" >> release-notes.md
          git log -10 --pretty=format:"- %h %s" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Build Metrics" >> release-notes.md
          echo "- **Node Environment:** v22" >> release-notes.md
          echo "- **Platforms:** Windows x64, macOS (Intel + Apple Silicon)" >> release-notes.md
          echo "- **Core Dependencies:** Electron, React, Tailwind CSS v4" >> release-notes.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: false
          make_latest: true
          body_path: ${{ matrix.os == 'windows-latest' && 'release-notes.md' || '' }}
          files: ${{ matrix.artifact_glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
