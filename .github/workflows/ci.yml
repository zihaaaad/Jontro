name: CI Build Check

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Lint & Typecheck (Linux 1x Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Git repository (Shallow Clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js & Dependency Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Build Web Bundle
        run: npx vite build
